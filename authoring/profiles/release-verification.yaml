id: release-verification
version: 1.0.0
description: 发布验收；所有关键验收点必须具备阻断证据
case_id_template: "{{source_id}}-{{branch}}"
required_sections:
  - 背景与目标
  - 触发条件
  - 用户的话
  - 分支矩阵
  - Agent 期望链路
  - UI 期望响应链路
  - 验收关注点
required_capabilities: []
required_assertion_templates:
  - agent-executions
require_fixtures: true
require_evidence: true
default_threshold: 1
a2ui_capture: true
